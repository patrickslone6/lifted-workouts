name: Fix history deletion and home completion
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Apply patch and build
        run: |
          sed -i 's/nonce(/once(/g' scripts/fix-history-delete-and-home.mjs
          node scripts/fix-history-delete-and-home.mjs
          npm install
          npm run build
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/fix-history-delete-and-home.mjs .github/workflows/fix-history-delete-and-home.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Keep home completion state and delete training logs"
          git fetch origin main
          git rebase origin/main
          git push origin main
