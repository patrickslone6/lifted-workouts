name: Final Lifted repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-final-once.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply repair and build
        run: |
          node scripts/repair-final-once.mjs
          npm install
          npm run build
      - name: Commit repaired app and remove one-shot tooling
        run: |
          rm -f scripts/repair-final-once.mjs scripts/fix-coach-ai.mjs scripts/fix-history-coach-final.mjs scripts/fix-history-delete-and-home.mjs
          rm -f .github/workflows/repair-final-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/HistoryScreen.tsx src/services/storage.ts server.ts scripts .github/workflows
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix history deletion and make Coach AI resilient'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
