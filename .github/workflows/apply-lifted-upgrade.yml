name: Apply Lifted upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply upgrade
        run: node scripts/apply-lifted-upgrade.mjs
      - name: Commit upgrade and remove one-time patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-lifted-upgrade.mjs .github/workflows/apply-lifted-upgrade.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade AI planning, mobile UX and persistent training context"
          git push origin main
