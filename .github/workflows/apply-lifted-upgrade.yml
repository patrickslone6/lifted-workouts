name: Apply Lifted upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply upgrade
        run: node scripts/apply-lifted-upgrade.mjs

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/TodayScreen.tsx src/services/storage.ts server.ts
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade AI planning, mobile UX and persistent training context"
          git push origin main
