name: Apply persistence and rest fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-persistence-rest-fix.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-persistence-rest-fix.mjs .github/workflows/apply-persistence-rest-fix.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Persist every training step and use adaptive rest times"
          git push origin main
