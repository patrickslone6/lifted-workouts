name: Apply AI activity context patch

on:
  workflow_run:
    workflows: ["Apply persistence and rest fix"]
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply AI activity context
        run: node scripts/apply-ai-activity-context.mjs
      - name: Commit patch and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-ai-activity-context.mjs .github/workflows/apply-ai-activity-context.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Feed completed mobility and plyometrics into AI"
          git push origin main
