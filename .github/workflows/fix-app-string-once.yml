name: Fix App syntax once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-app-string-once.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix, build, and verify
        run: |
          node scripts/fix-app-string-once.mjs
          npm install
          npm run lint
          npm run build
      - name: Commit fix and remove one-shot tooling
        run: |
          rm -f scripts/fix-app-string-once.mjs .github/workflows/fix-app-string-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx scripts .github/workflows
          git commit -m 'Fix App syntax after final repair'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
