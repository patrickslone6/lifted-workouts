name: Final history and Coach repair
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-history-coach-final.mjs'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch and build
        run: |
          node scripts/fix-history-coach-final.mjs
          npm install
          npm run build
      - name: Commit repaired app and remove repair files
        run: |
          rm -f scripts/fix-history-coach-final.mjs .github/workflows/final-history-coach-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/storage.ts src/components/HistoryScreen.tsx src/App.tsx server.ts
          git add -u scripts/fix-history-coach-final.mjs .github/workflows/final-history-coach-repair.yml
          git diff --cached --quiet || git commit -m 'Fix history deletion and Coach AI'
          git fetch origin main
          git rebase origin/main
          git push origin main
